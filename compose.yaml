name: commerce-agent
x-backend: &backend
  build:
    context: .
    dockerfile: deploy/backend.Dockerfile
  image: commerce-agent-api:local
  init: true
  volumes:
    - commerce-data:/app/data
  environment: &environment
    OPENAI_BASE_URL: ${DOCKER_MODEL_BASE_URL:-http://host.docker.internal:8001/v1}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-local-dev-key}
    QWEN_MODEL: ${QWEN_MODEL:-qwen3.5-4b}
    JEV_MODE: ${JEV_MODE:-off}
    JEV_SCOPE_ENABLED: ${JEV_SCOPE_ENABLED:-false}
    DEMO_USER_ID: ${DEMO_USER_ID:-U00001}
    JEV_BASE_URL: ${DOCKER_JEV_BASE_URL:-http://host.docker.internal:8795/v1}
    JEV_MODEL: ${JEV_MODEL:-kev-4b}
    JEV_API_KEY: ${JEV_API_KEY:-}
    JEV_TIMEOUT_SECONDS: ${JEV_TIMEOUT_SECONDS:-3}
    DATA_DIR: /app/data
    COMMERCE_DB_PATH: /app/data/portfolio/commerce.sqlite3
    KNOWLEDGE_DB_PATH: /app/data/portfolio/knowledge.sqlite3
    MEMORY_DB_PATH: /app/data/portfolio/memory.sqlite3
    RAG_BACKEND: fts
    MAX_ACTIVE_CHATS: ${MAX_ACTIVE_CHATS:-2}
    MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-180}
    AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-600}
    MODEL_RETRIES: ${MODEL_RETRIES:-1}
    COMMERCE_TOOL_TRANSPORT: ${COMMERCE_TOOL_TRANSPORT:-local}
    CATALOG_EVIDENCE_ENABLED: ${CATALOG_EVIDENCE_ENABLED:-true}
services:
  seed:
    <<: *backend
    restart: 'no'
    command: ["python", "scripts/build_dataset.py", "--output", "/app/data/portfolio"]
  api:
    <<: *backend
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
    extra_hosts: ["host.docker.internal:host-gateway"]
    # API stays on the Compose network. Do not expose an unauthenticated sandbox publicly.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 630s
  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        FASTAPI_BASE_URL: http://api:8000
        AGENT_PROXY_TIMEOUT_MS: ${AGENT_PROXY_TIMEOUT_MS:-630000}
    image: commerce-agent-web:local
    init: true
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api]
  load:
    build:
      context: .
      dockerfile: deploy/load.Dockerfile
    profiles: [load]
    volumes: ["./reports:/reports"]
    command: ["-f", "/tests/locustfile.py", "--host", "http://api:8000", "--headless", "-u", "10", "-r", "2", "-t", "60s", "--csv", "/reports/locust", "BrowseUser"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  commerce-data:
